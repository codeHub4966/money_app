name: money_app_flutter
description: Local-first money management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  go_router: ^14.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  local_auth: ^2.3.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
